name: macOS signed release candidate

on:
  pull_request:
    paths:
      - '.github/workflows/package-macos.yml'
      - 'build/entitlements.mac*.plist'
      - 'docs/releases/macos-signed-release.md'
      - 'electron/services/macos-release-contract.test.ts'
      - 'electron/services/packaging-resources.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/macos-release-contract.mjs'
      - 'scripts/macos-release-contract.d.mts'
      - 'scripts/notarize-macos-artifacts.sh'
      - 'scripts/verify-macos-release.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-unsigned-contract:
    name: Validate unsigned macOS contract (not releasable)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release contract tests
        run: >-
          npm test --
          electron/services/macos-release-contract.test.ts
          electron/services/packaging-resources.test.ts

      - name: Validate entitlement property lists
        run: |
          plutil -lint build/entitlements.mac.plist
          plutil -lint build/entitlements.mac.inherit.plist
          if /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.cs.allow-dyld-environment-variables' \
            build/entitlements.mac.plist >/dev/null 2>&1; then
            echo '::error::DYLD environment entitlement is forbidden'
            exit 1
          fi
          if /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.device.audio-input' \
            build/entitlements.mac.inherit.plist >/dev/null 2>&1; then
            echo '::error::Capture permission must not be inherited by helpers'
            exit 1
          fi
          if /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.screen-recording' \
            build/entitlements.mac.plist >/dev/null 2>&1; then
            echo '::error::Unsupported screen-recording entitlement is forbidden'
            exit 1
          fi

      - name: Build unsigned universal app bundle for configuration validation
        run: npm run package:mac:unsigned

      - name: Prove validation output is not a release candidate
        run: |
          app_count=$(find release/macos-unsigned -type d -name '*.app' -prune | wc -l | tr -d ' ')
          test "$app_count" -eq 1
          app_path=$(find release/macos-unsigned -type d -name '*.app' -prune -print -quit)
          if codesign --display --verbose=4 "$app_path" 2>&1 \
            | grep -Fq 'Authority=Developer ID Application:'; then
            echo '::error::Unsigned validation unexpectedly used a Developer ID identity'
            exit 1
          fi
          test -z "$(find release/macos-unsigned -type f \
            \( -name '*.dmg' -o -name '*.pkg' \) -print -quit)"

  package-signed-release-candidate:
    name: Package signed and notarized universal candidate
    if: github.event_name == 'workflow_dispatch'
    needs: validate-unsigned-contract
    runs-on: macos-14
    timeout-minutes: 90
    environment: macos-production-release
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOS_RELEASE_DIR: release/macos-universal-${{ github.sha }}
      MACOS_DMG_NOTARY_RESULT: release/macos-universal-${{ github.sha }}/macos-dmg-notary-result.json
      MACOS_PKG_NOTARY_RESULT: release/macos-universal-${{ github.sha }}/macos-pkg-notary-result.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Verify immutable source and version
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          test "$package_version" = "$lock_version"
          test "$package_version" != 0.1.3
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$package_version"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Materialize protected credentials without logging secret values
        env:
          MACOS_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_P12_BASE64 }}
          MACOS_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          required=(
            MACOS_APPLICATION_CERTIFICATE_P12_BASE64
            MACOS_APPLICATION_CERTIFICATE_PASSWORD
            MACOS_INSTALLER_CERTIFICATE_P12_BASE64
            MACOS_INSTALLER_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            EXPECTED_APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if test -z "${!name:-}"; then
              echo "::error::Missing protected macOS release credential or variable: $name"
              exit 1
            fi
          done

          umask 077
          app_certificate="$RUNNER_TEMP/developer-id-application.p12"
          installer_certificate="$RUNNER_TEMP/developer-id-installer.p12"
          api_key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$MACOS_APPLICATION_CERTIFICATE_P12_BASE64" \
            | openssl base64 -d -A -out "$app_certificate"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" \
            | openssl base64 -d -A -out "$installer_certificate"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" \
            | openssl base64 -d -A -out "$api_key"
          test -s "$app_certificate"
          test -s "$installer_certificate"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$api_key"

          {
            echo "CSC_LINK=$app_certificate"
            echo "CSC_INSTALLER_LINK=$installer_certificate"
            echo "APPLE_API_KEY=$api_key"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build, Developer ID sign, and notarize app and PKG
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_PASSWORD }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          npm run package:mac --
          --config.directories.output="$MACOS_RELEASE_DIR"

      - name: Notarize and staple DMG and PKG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          scripts/notarize-macos-artifacts.sh
          "$MACOS_RELEASE_DIR"
          "$MACOS_DMG_NOTARY_RESULT"
          "$MACOS_PKG_NOTARY_RESULT"

      - name: Verify signatures, hardened runtime, tickets, and Gatekeeper
        run: >-
          scripts/verify-macos-release.sh
          "$MACOS_RELEASE_DIR"
          "$PACKAGE_VERSION"
          "$EXPECTED_APPLE_TEAM_ID"
          com.acik.platform.meeting-intelligence

      - name: Verify signed updater payload contract
        run: npm run release:mac:verify-update

      - name: Write source-bound SHA-256 and provenance manifests
        run: npm run release:mac:manifest

      - name: Verify SHA-256 manifest
        working-directory: ${{ env.MACOS_RELEASE_DIR }}
        run: shasum -a 256 --check SHA256SUMS-macos.txt

      - name: Sign artifacts and provenance with GitHub OIDC
        run: |
          shopt -s nullglob
          subjects=(
            "$MACOS_RELEASE_DIR"/*.dmg
            "$MACOS_RELEASE_DIR"/*.pkg
            "$MACOS_RELEASE_DIR"/*.zip
            "$MACOS_RELEASE_DIR"/*.zip.blockmap
            "$MACOS_RELEASE_DIR"/latest-mac.yml
            "$MACOS_RELEASE_DIR"/macos-release-provenance.json
            "$MACOS_RELEASE_DIR"/SHA256SUMS-macos.txt
          )
          test "${#subjects[@]}" -eq 7
          for subject in "${subjects[@]}"; do
            cosign sign-blob \
              --yes \
              --bundle "$subject.sigstore.json" \
              "$subject"
          done

      - name: Verify source-bound Sigstore evidence
        run: |
          shopt -s nullglob
          subjects=(
            "$MACOS_RELEASE_DIR"/*.dmg
            "$MACOS_RELEASE_DIR"/*.pkg
            "$MACOS_RELEASE_DIR"/*.zip
            "$MACOS_RELEASE_DIR"/*.zip.blockmap
            "$MACOS_RELEASE_DIR"/latest-mac.yml
            "$MACOS_RELEASE_DIR"/macos-release-provenance.json
            "$MACOS_RELEASE_DIR"/SHA256SUMS-macos.txt
          )
          test "${#subjects[@]}" -eq 7
          for subject in "${subjects[@]}"; do
            cosign verify-blob \
              --bundle "$subject.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/package-macos.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
              "$subject"
          done

      - name: Upload immutable signed macOS release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meeting-intelligence-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.MACOS_RELEASE_DIR }}/*.dmg
            ${{ env.MACOS_RELEASE_DIR }}/*.pkg
            ${{ env.MACOS_RELEASE_DIR }}/*.zip
            ${{ env.MACOS_RELEASE_DIR }}/*.zip.blockmap
            ${{ env.MACOS_RELEASE_DIR }}/latest-mac.yml
            ${{ env.MACOS_RELEASE_DIR }}/macos-release-provenance.json
            ${{ env.MACOS_RELEASE_DIR }}/SHA256SUMS-macos.txt
            ${{ env.MACOS_RELEASE_DIR }}/*.sigstore.json
            ${{ env.MACOS_DMG_NOTARY_RESULT }}
            ${{ env.MACOS_PKG_NOTARY_RESULT }}

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f -- \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP/developer-id-installer.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
