name: Linux package evidence

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_DIR: release/linux-x64-${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Install Linux package tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rpm cpio
          command -v rpmbuild
          command -v rpm2cpio
          command -v cpio
          command -v sha256sum

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build x64 AppImage, deb and rpm
        run: |
          npm run build
          npx electron-builder \
            --linux \
            --x64 \
            --publish never \
            --config.directories.output="$PACKAGE_DIR"

      - name: Verify packaged runtime dependencies
        run: |
          app_asar="$PACKAGE_DIR/linux-unpacked/resources/app.asar"
          test -f "$app_asar"
          ./node_modules/.bin/asar list "$app_asar" \
            | grep -Fx '/node_modules/electron-updater/package.json'

      - name: Verify RPM scriptlets are POSIX-compatible
        run: |
          shopt -s nullglob
          rpms=("$PACKAGE_DIR"/Meeting-Intelligence-*-x86_64.rpm)
          test "${#rpms[@]}" -eq 1
          rpm -qp --scripts "${rpms[0]}" > "$RUNNER_TEMP/rpm-scripts.txt"
          grep -Fq 'postinstall scriptlet (using /bin/sh)' "$RUNNER_TEMP/rpm-scripts.txt"
          grep -Fq 'if ! { [ -L /proc/self/ns/user ] && unshare --user true; }; then' \
            "$RUNNER_TEMP/rpm-scripts.txt"
          grep -Fq 'postuninstall scriptlet (using /bin/sh)' "$RUNNER_TEMP/rpm-scripts.txt"
          grep -Fq "if [ \"\${1:-0}\" -gt 0 ]; then" "$RUNNER_TEMP/rpm-scripts.txt"
          grep -Fq 'posttrans scriptlet (using /bin/sh)' "$RUNNER_TEMP/rpm-scripts.txt"
          test "$(grep -Fc "update-alternatives --install '/usr/bin/platform-desktop'" \
            "$RUNNER_TEMP/rpm-scripts.txt")" -eq 2
          if grep -Fq '[[' "$RUNNER_TEMP/rpm-scripts.txt"; then
            echo '::error::RPM scriptlet contains a Bash-only [[ expression'
            exit 1
          fi

      - name: Verify tag matches the packaged version
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"
          test "$(git rev-list --max-count=1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - name: Record immutable artifact hashes
        run: |
          cd "$PACKAGE_DIR"
          shopt -s nullglob
          artifacts=(
            Meeting-Intelligence-*-x86_64.AppImage
            Meeting-Intelligence-*-amd64.deb
            Meeting-Intelligence-*-x86_64.rpm
            latest-linux.yml
          )
          test "${#artifacts[@]}" -eq 4
          printf '%s\0' "${artifacts[@]}" \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS-linux-x64.txt
          sha256sum --check SHA256SUMS-linux-x64.txt

      - name: Sign Linux package provenance
        run: |
          cd "$PACKAGE_DIR"
          while read -r _ artifact; do
            cosign sign-blob \
              --yes \
              --bundle "$artifact.sigstore.json" \
              "$artifact"
          done < SHA256SUMS-linux-x64.txt

      - name: Upload Linux package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meeting-intelligence-linux-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.PACKAGE_DIR }}/Meeting-Intelligence-*-x86_64.AppImage
            ${{ env.PACKAGE_DIR }}/Meeting-Intelligence-*-amd64.deb
            ${{ env.PACKAGE_DIR }}/Meeting-Intelligence-*-x86_64.rpm
            ${{ env.PACKAGE_DIR }}/latest-linux.yml
            ${{ env.PACKAGE_DIR }}/*.sigstore.json
            ${{ env.PACKAGE_DIR }}/SHA256SUMS-linux-x64.txt

  smoke-linux-x64:
    needs: package-linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download immutable Linux package evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meeting-intelligence-linux-x64-${{ github.sha }}
          path: release

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Verify immutable hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS-linux-x64.txt

      - name: Verify signed build provenance
        run: |
          while read -r _ artifact; do
            cosign verify-blob \
              --bundle "release/$artifact.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/package-linux.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
              "release/$artifact"
          done < release/SHA256SUMS-linux-x64.txt

      - name: Install the deb package
        run: |
          shopt -s nullglob
          packages=(release/Meeting-Intelligence-*-amd64.deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils xvfb rpm "./${packages[0]}"
          command -v rpm
          command -v rpmbuild

      - name: Verify desktop registration
        run: |
          desktop_file=/usr/share/applications/meeting-intelligence.desktop
          test -f "$desktop_file"
          desktop-file-validate "$desktop_file"
          grep -Fx 'MimeType=x-scheme-handler/meeting-intelligence;' "$desktop_file"
          grep -Fx 'Exec="/opt/Meeting Intelligence/platform-desktop" %U' "$desktop_file"
          gio mime x-scheme-handler/meeting-intelligence \
            | grep -F 'meeting-intelligence.desktop'
          test -x '/opt/Meeting Intelligence/platform-desktop'

      - name: Launch deb, AppImage and rpm applications
        run: |
          cleanup_launch() {
            local process_group=${launch_pid:-}
            if test -z "$process_group"; then
              return
            fi

            kill -TERM -- "-$process_group" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 -- "-$process_group" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done

            if kill -0 -- "-$process_group" 2>/dev/null; then
              kill -KILL -- "-$process_group" 2>/dev/null || true
              for _ in $(seq 1 20); do
                if ! kill -0 -- "-$process_group" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
            fi

            wait "$process_group" 2>/dev/null || true
            if kill -0 -- "-$process_group" 2>/dev/null; then
              echo "::error::application process group survived TERM and KILL"
              return 1
            fi
            launch_pid=
          }
          cleanup_smoke() {
            cleanup_launch || true
            if test -n "${appimage_extract_dir:-}"; then
              rm -rf -- "$appimage_extract_dir"
            fi
            if test -n "${legacy_topdir:-}"; then
              rm -rf -- "$legacy_topdir"
            fi
          }
          trap cleanup_smoke EXIT

          if ! unshare --user true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare --user true
          fi

          assert_renderer_ready() {
            local package_kind=$1
            shift
            local log_file="meeting-intelligence-$package_kind.log"

            MEETING_INTELLIGENCE_RELEASE_SMOKE=1 \
              setsid xvfb-run --auto-servernum "$@" \
              >"$log_file" 2>&1 &
            launch_pid=$!

            local ready=false
            for _ in $(seq 1 30); do
              if grep -Fxq 'MEETING_INTELLIGENCE_RELEASE_SMOKE_READY' \
                "$log_file"; then
                ready=true
                break
              fi
              if ! kill -0 "$launch_pid" 2>/dev/null; then
                wait "$launch_pid" || true
                cat "$log_file"
                echo "::error::$package_kind application exited before renderer readiness"
                exit 1
              fi
              sleep 0.5
            done

            if test "$ready" != true; then
              cat "$log_file"
              echo "::error::$package_kind renderer readiness was not observed within 15 seconds"
              exit 1
            fi

            sleep 2
            if ! kill -0 "$launch_pid" 2>/dev/null; then
              wait "$launch_pid" || true
              cat "$log_file"
              echo "::error::$package_kind application exited during renderer stability check"
              exit 1
            fi

            cleanup_launch
            cat "$log_file"
          }

          assert_renderer_ready deb '/opt/Meeting Intelligence/platform-desktop'

          shopt -s nullglob
          appimages=(release/Meeting-Intelligence-*-x86_64.AppImage)
          rpms=(release/Meeting-Intelligence-*-x86_64.rpm)
          test "${#appimages[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          chmod +x "${appimages[0]}"
          appimage_path=$(realpath "${appimages[0]}")
          appimage_extract_dir=$(mktemp -d)
          (
            cd "$appimage_extract_dir"
            "$appimage_path" --appimage-extract >/dev/null
          )
          appimage_root="$appimage_extract_dir/squashfs-root"
          test -x "$appimage_root/AppRun"
          assert_renderer_ready appimage env \
            APPIMAGE="$appimage_path" \
            APPDIR="$appimage_root" \
            "$appimage_root/AppRun"
          rm -rf -- "$appimage_extract_dir"
          appimage_extract_dir=

          sudo dpkg --remove platform-desktop
          test ! -e '/opt/Meeting Intelligence/platform-desktop'
          rpm_package_name=$(rpm -qp --queryformat '%{NAME}\n' "${rpms[0]}")
          test "$rpm_package_name" = platform-desktop
          legacy_topdir=$(mktemp -d)
          mkdir -p "$legacy_topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cat > "$legacy_topdir/SPECS/platform-desktop-legacy.spec" <<'SPEC'
          Name: platform-desktop
          Version: 0.1.2
          Release: 1
          Summary: Legacy upgrade lifecycle fixture
          License: MIT
          BuildArch: x86_64

          %description
          Reproduces the unconditional legacy postun registration cleanup.

          %install
          mkdir -p "%{buildroot}/opt/Meeting Intelligence"
          cp /bin/true "%{buildroot}/opt/Meeting Intelligence/platform-desktop"

          %files
          "/opt/Meeting Intelligence/platform-desktop"

          %post
          update-alternatives --install '/usr/bin/platform-desktop' 'platform-desktop' '/opt/Meeting Intelligence/platform-desktop' 100
          mkdir -p /etc/apparmor.d
          : > /etc/apparmor.d/platform-desktop

          %postun
          update-alternatives --remove 'platform-desktop' '/opt/Meeting Intelligence/platform-desktop'
          rm -f /etc/apparmor.d/platform-desktop
          SPEC
          rpmbuild --define "_topdir $legacy_topdir" \
            -bb "$legacy_topdir/SPECS/platform-desktop-legacy.spec"
          legacy_rpm=$(find "$legacy_topdir/RPMS" -type f -name '*.rpm' -print -quit)
          test -n "$legacy_rpm"
          sudo rpm --install --nodeps "$legacy_rpm"
          sudo rpm -q --queryformat '%{VERSION}\n' platform-desktop | grep -Fx '0.1.2'

          expected_rpm_version=$(rpm -qp --queryformat '%{VERSION}\n' "${rpms[0]}")
          sudo rpm --upgrade --nodeps "${rpms[0]}"
          sudo rpm -q --queryformat '%{VERSION}\n' platform-desktop \
            | grep -Fx "$expected_rpm_version"
          sudo rpm -q platform-desktop
          test -x '/opt/Meeting Intelligence/platform-desktop'
          update-alternatives --query platform-desktop \
            | grep -Fx 'Value: /opt/Meeting Intelligence/platform-desktop'
          if apparmor_status --enabled >/dev/null 2>&1 && \
             apparmor_parser --skip-kernel-load --debug \
               '/opt/Meeting Intelligence/resources/apparmor-profile' >/dev/null 2>&1; then
            test -f /etc/apparmor.d/platform-desktop
          fi

          assert_renderer_ready rpm-upgrade '/opt/Meeting Intelligence/platform-desktop'

          sudo rpm --erase platform-desktop
          if sudo rpm -q platform-desktop; then
            echo '::error::RPM package remained installed after upgrade-path erase'
            exit 1
          fi
          test ! -e '/opt/Meeting Intelligence/platform-desktop'
          test ! -e /usr/bin/platform-desktop
          test ! -L /usr/bin/platform-desktop
          test ! -e /etc/apparmor.d/platform-desktop

          sudo rpm --install --nodeps "${rpms[0]}"
          sudo rpm -q platform-desktop
          test -x '/opt/Meeting Intelligence/platform-desktop'
          update-alternatives --query platform-desktop \
            | grep -Fx 'Value: /opt/Meeting Intelligence/platform-desktop'
          if apparmor_status --enabled >/dev/null 2>&1 && \
             apparmor_parser --skip-kernel-load --debug \
               '/opt/Meeting Intelligence/resources/apparmor-profile' >/dev/null 2>&1; then
            test -f /etc/apparmor.d/platform-desktop
          fi

          sudo update-desktop-database /usr/share/applications
          desktop-file-validate /usr/share/applications/meeting-intelligence.desktop
          grep -Fx 'Exec="/opt/Meeting Intelligence/platform-desktop" %U' \
            /usr/share/applications/meeting-intelligence.desktop
          grep -Fx 'MimeType=x-scheme-handler/meeting-intelligence;' \
            /usr/share/applications/meeting-intelligence.desktop
          gio mime x-scheme-handler/meeting-intelligence \
            | grep -F 'meeting-intelligence.desktop'
          assert_renderer_ready rpm-install '/opt/Meeting Intelligence/platform-desktop'

          sudo rpm --erase platform-desktop
          if sudo rpm -q platform-desktop; then
            echo '::error::RPM package remained installed after erase'
            exit 1
          fi
          test ! -e '/opt/Meeting Intelligence/platform-desktop'
          test ! -e /usr/bin/platform-desktop
          test ! -L /usr/bin/platform-desktop
          test ! -e /etc/apparmor.d/platform-desktop
          rm -rf -- "$legacy_topdir"
          legacy_topdir=

          trap - EXIT

  publish-release:
    if: github.ref_type == 'tag'
    needs:
      - package-linux-x64
      - smoke-linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable Linux package evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meeting-intelligence-linux-x64-${{ github.sha }}
          path: release

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Publish Linux packages and updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          verify_remote_tag_sha() {
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            while test "$object_type" = tag; do
              read -r object_type object_sha < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done
            test "$object_type" = commit
            test "$object_sha" = "$GITHUB_SHA"
          }

          verify_signed_provenance() {
            local artifact=$1
            cosign verify-blob \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/package-linux.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
              "$artifact"
          }

          assets=(
            release/Meeting-Intelligence-*-x86_64.AppImage
            release/Meeting-Intelligence-*-amd64.deb
            release/Meeting-Intelligence-*-x86_64.rpm
            release/latest-linux.yml
            release/*.sigstore.json
            release/SHA256SUMS-linux-x64.txt
          )
          test "${#assets[@]}" -eq 9
          while read -r _ artifact; do
            verify_signed_provenance "release/$artifact"
          done < release/SHA256SUMS-linux-x64.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets."
            exit 1
          fi

          verify_remote_tag_sha
          created_release_response=$(mktemp)
          created_release_id=
          release_name="Meeting Intelligence $GITHUB_REF_NAME"
          draft_release_name="$release_name [run $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT]"
          cleanup_release() {
            local release_id=$created_release_id
            local lookup_response
            local candidate_response
            local last_lookup_confirmed_zero=false
            local release_state
            local state_succeeded=false
            local delete_succeeded=false
            local status_response
            local status_code
            local -a candidate_release_ids=()

            if test -z "$release_id" && jq -e '.id' "$created_release_response" >/dev/null 2>&1; then
              release_id=$(jq -er '.id' "$created_release_response")
            fi

            if test -z "$release_id"; then
              lookup_response=$(mktemp)
              candidate_response=$(mktemp)
              for attempt in 1 2 3 4 5; do
                last_lookup_confirmed_zero=false
                if ! gh api \
                  "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  > "$lookup_response"; then
                  sleep "$attempt"
                  continue
                fi
                if ! jq -r \
                  --arg name "$draft_release_name" \
                  --arg tag "$GITHUB_REF_NAME" \
                  '.[] | select(.draft and .name == $name and .tag_name == $tag) | .id' \
                  "$lookup_response" \
                  > "$candidate_response"; then
                  sleep "$attempt"
                  continue
                fi

                mapfile -t candidate_release_ids < "$candidate_response"
                if test "${#candidate_release_ids[@]}" -gt 1; then
                  echo "::error::Multiple draft releases matched cleanup marker $draft_release_name"
                  return 1
                fi
                if test "${#candidate_release_ids[@]}" -eq 1; then
                  release_id=${candidate_release_ids[0]}
                  break
                fi
                last_lookup_confirmed_zero=true
                sleep "$attempt"
              done
              if test -z "$release_id"; then
                if test "$last_lookup_confirmed_zero" != true; then
                  echo "::error::Unable to inspect releases while cleaning draft marker $draft_release_name"
                  return 1
                fi
                return 0
              fi
            fi

            release_state=$(mktemp)
            for attempt in 1 2 3 4 5; do
              if gh api \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                > "$release_state"; then
                state_succeeded=true
                break
              fi
              sleep "$attempt"
            done
            if test "$state_succeeded" != true; then
              echo "::error::Unable to inspect exact release ID $release_id before cleanup"
              return 1
            fi

            if ! jq -e \
              --argjson id "$release_id" \
              --arg draft_name "$draft_release_name" \
              --arg release_name "$release_name" \
              --arg tag "$GITHUB_REF_NAME" \
              '.id == $id and .tag_name == $tag and (.name == $draft_name or .name == $release_name)' \
              "$release_state" \
              >/dev/null; then
              echo "::error::Release cleanup identity guard failed for exact ID $release_id"
              return 1
            fi

            if test "$(jq -r '.immutable' "$release_state")" = true; then
              return 0
            fi

            for attempt in 1 2 3 4 5; do
              if gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                >/dev/null; then
                delete_succeeded=true
                break
              fi
              sleep "$attempt"
            done
            if test "$delete_succeeded" != true; then
              echo "::error::Unable to delete mutable release ID $release_id after retries"
              return 1
            fi

            for attempt in 1 2 3 4 5; do
              status_response=$(gh api \
                --include \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                2>&1) || true
              status_code=$(printf '%s\n' "$status_response" \
                | awk '/^HTTP/{code=$2} END{print code}')
              if test "$status_code" = 404; then
                return 0
              fi
              sleep "$attempt"
            done

            echo "::error::Release ID $release_id was not confirmed deleted with HTTP 404"
            return 1
          }
          on_exit() {
            local exit_code=$?
            trap - EXIT
            if ! cleanup_release; then
              if test "$exit_code" -eq 0; then
                exit 1
              fi
              exit "$exit_code"
            fi
            exit "$exit_code"
          }
          trap on_exit EXIT

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$draft_release_name" \
            -F draft=true \
            -F generate_release_notes=true \
            > "$created_release_response"
          created_release_id=$(jq -er '.id' "$created_release_response")
          created_upload_url=$(jq -er '.upload_url | sub("\\{.*$"; "")' \
            "$created_release_response")
          test -n "$created_release_id"
          test -n "$created_upload_url"

          for asset in "${assets[@]}"; do
            asset_name=${asset#release/}
            encoded_name=$(jq -rn --arg value "$asset_name" '$value | @uri')
            uploaded_name=$(gh api \
              --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "$asset" \
              "$created_upload_url?name=$encoded_name" \
              --jq '.name')
            test "$uploaded_name" = "$asset_name"
          done

          expected_assets=$(printf '%s\n' "${assets[@]#release/}" | sort)
          actual_assets=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$created_release_id/assets?per_page=100" \
            --paginate \
            --jq '.[].name' \
            | sort)
          diff -u <(printf '%s\n' "$expected_assets") \
            <(printf '%s\n' "$actual_assets")

          mkdir release-verification
          while IFS=$'\t' read -r asset_name asset_id; do
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "release-verification/$asset_name"
          done < <(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id/assets?per_page=100" \
              --paginate \
              --jq '.[] | [.name, (.id | tostring)] | @tsv' \
              | sort
          )
          (
            cd release-verification
            sha256sum --check SHA256SUMS-linux-x64.txt
          )

          for asset in "${assets[@]}"; do
            cmp -- "$asset" "release-verification/${asset#release/}"
          done
          while read -r _ artifact; do
            verify_signed_provenance "release-verification/$artifact"
          done < release-verification/SHA256SUMS-linux-x64.txt

          verify_remote_tag_sha
          published_release_id=$(gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$created_release_id" \
            -f name="$release_name" \
            -F draft=false \
            --jq '.id')
          test "$published_release_id" = "$created_release_id"
          published_release_response=$(mktemp)
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/$created_release_id" \
            > "$published_release_response"
          immutable_state=$(jq -r \
            --argjson id "$created_release_id" \
            --arg name "$release_name" \
            --arg tag "$GITHUB_REF_NAME" \
            'select(.id == $id and .draft == false and .name == $name and .tag_name == $tag) | .immutable' \
            "$published_release_response")
          if test "$immutable_state" != true; then
            echo "::error::Published release is not immutable; removing exact release ID $created_release_id"
            exit 1
          fi
          trap - EXIT
