name: Windows package evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (default: main HEAD)'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows-x64:
    # Unsigned NSIS installer + portable .exe cross-built on Linux via wine.
    # Purpose: dev/smoke packages for internal testing (Zeynep 2026-07-21).
    # Code signing (Authenticode) is intentionally SKIPPED here — a signed
    # release track goes through a separate workflow when the signing setup
    # (AG-018 osslsigncode + internal CA) is wired for platform-desktop.
    # SmartScreen warns on first launch; that is expected for dev packages.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PACKAGE_DIR: release/windows-x64-${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Windows cross-build tools (wine + nsis)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            wine wine32:i386 wine64 mono-devel nsis fakeroot
          command -v wine
          command -v makensis

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build x64 Windows NSIS + portable (unsigned)
        env:
          # Explicit opt-out of signing — electron-builder would otherwise
          # try to sign and fail on Linux without Authenticode credentials.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        run: |
          npm run build
          npx electron-builder \
            --win \
            --x64 \
            --publish never \
            --config.win.forceCodeSigning=false \
            --config.directories.output="$PACKAGE_DIR"

      - name: Verify packaged installer + portable exist
        run: |
          shopt -s nullglob
          installers=("$PACKAGE_DIR"/Meeting-Intelligence-Setup-*.exe)
          portables=("$PACKAGE_DIR"/Meeting-Intelligence-*.exe)
          test "${#installers[@]}" -ge 1 || {
            echo "ERR: NSIS installer missing"; ls -la "$PACKAGE_DIR" || true; exit 1
          }
          echo "Installer: ${installers[0]}"
          echo "Portable candidates: ${portables[*]}"
          for f in "${installers[@]}" "${portables[@]}"; do
            [ -f "$f" ] || continue
            size=$(stat -c '%s' "$f")
            test "$size" -gt 10000000 || {
              echo "ERR: $f is suspiciously small ($size bytes)"; exit 1
            }
            sha256sum "$f"
          done

      - name: Emit build metadata
        run: |
          {
            echo "version=$PACKAGE_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "signing=unsigned-dev-smoke"
          } > "$PACKAGE_DIR/BUILD_METADATA.txt"
          ls -la "$PACKAGE_DIR"

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: windows-x64-${{ env.PACKAGE_VERSION }}-${{ github.sha }}
          path: |
            ${{ env.PACKAGE_DIR }}/Meeting-Intelligence-*.exe
            ${{ env.PACKAGE_DIR }}/BUILD_METADATA.txt
          retention-days: 14
          if-no-files-found: error
