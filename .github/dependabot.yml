# Dependabot v2 — automated dependency updates (Faz 24 Meeting Intelligence).
#
# Rationale: `security:audit` was blocking CI on rolling npm advisories that
# had no code path in this app (brace-expansion, js-yaml, tar — all transitive).
# One-off `npm audit fix` commits pushed by humans/AI is short-lived — the next
# advisory reproduces the same friction. Dependabot maintains this baseline
# automatically so the audit gate stops being a scheduled tax.
#
# Layers:
#   - npm ecosystem, weekly (Monday) grouped patch+minor — one review decision
#     per week for routine deps. Majors stay individual (each needs isolated
#     runtime + smoke review).
#   - Security fixes are OPENED IMMEDIATELY by dependabot regardless of the
#     weekly cadence — this is dependabot's default behaviour for advisories
#     with a fix (docs.github.com/en/code-security/dependabot/dependabot-security-updates).
#     A separate "security-only" npm entry would violate v2's uniqueness rule
#     (one entry per ecosystem+directory+target-branch) and is redundant.
#   - github-actions monthly (Monday) — pin-by-sha updates for workflow YAMLs.
#
# One entry per (ecosystem, directory, target-branch). Do not duplicate npm
# for a "daily security" channel — see comment above.

version: 2

updates:
  # ── npm (application deps) ───────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Istanbul'
    open-pull-requests-limit: 8
    labels:
      - 'dependencies'
      - 'npm'
      - 'faz-24'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    reviewers:
      - 'Halildeu'
    groups:
      # Non-major updates land as ONE PR/week. Majors stay individual.
      # Security fixes (from advisories) bypass this grouping automatically
      # and open as their own PR the moment the advisory is published.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # ── github-actions (workflow pins) ───────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Istanbul'
    open-pull-requests-limit: 4
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'faz-24'
    commit-message:
      prefix: 'chore(actions)'
      include: 'scope'
    reviewers:
      - 'Halildeu'
